# fly.toml — app Fly réelle (hostname couturia-5i9p7q.fly.dev)
app = 'couturia-5i9p7q'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  force_https = true
  # Toujours allumé : évite cold start sur annuaire / profils
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
