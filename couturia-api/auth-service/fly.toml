# fly.toml app configuration file generated for couturia on 2026-11-13T15:09:19Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'couturia'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  force_https = true
  # Auth doit rester chaud : inscription / connexion (évite timeout cold start)
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
