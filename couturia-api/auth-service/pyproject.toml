[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "couturia-auth-service"
version = "0.1.0"
description = "Auth service Couturia — utilisateurs, rôles, JWT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
