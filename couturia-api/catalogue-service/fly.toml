# fly.toml — couturia-catalogue
app = 'couturia-catalogue'
primary_region = 'ams'

[build]
  # Context = racine du repo (Launch Fly / --config)
  dockerfile = 'couturia-api/catalogue-service/Dockerfile.fly'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
