# fly.toml app configuration file generated for couturia-catalogue on 2026-11-13T15:47:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'couturia-catalogue'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
